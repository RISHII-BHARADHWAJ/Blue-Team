name: Blue-Team PHP and Compose CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all PHP files with PHP 8.2
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.2-cli \
            sh -c "find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l"

  compose-smoke:
    name: Docker Compose database and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FEED_COLLECTION_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated services
        run: docker compose up -d --build --wait
      - name: Verify SOAR database schema
        run: docker compose exec -T web php database/verify_schema.php
      - name: Verify cron ingestion uses the Docker database connection
        run: |
          docker compose exec -T web bash -n /start.sh /var/www/html/deploy/run-ingestion.sh
          docker compose exec -T -u www-data web bash -c 'source /run/threatpulse/ingestion.env; test "$DB_HOST" = db; test -w /var/log/feodo_realtime.log; test -w /var/log/threat_fetch.log'
      - name: Exercise SIEM-to-SOAR integration (transactional, dry-run only)
        run: docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_soar_pipeline.php
      - name: Verify durable event evidence and rollback behavior
        run: docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_event_evidence.php
      - name: Verify evidence HTTP access and safe rendering
        run: sh tests/check_event_evidence_http.sh
      - name: Run database-backed Phase 3 and 4 legacy suites
        run: |
          docker compose exec -T -e SOAR_LEGACY_DB_TEST=1 web php tests/run_phase3_tests.php
          docker compose exec -T -e SOAR_LEGACY_DB_TEST=1 web php tests/run_phase4_tests.php
      - name: Check HTTP login route
        run: curl --fail --show-error --silent http://localhost:8080/login.php --output /dev/null
      - name: Require login for analyst incident queue
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/incidents.php)
          if [ "$status" != "302" ]; then
            echo "Expected incident queue to redirect unauthenticated visitors (302); got $status" >&2
            exit 1
          fi
      - name: Reject HTTP database reset and diagnostic endpoints
        run: |
          for path in /reset_db.php /db_test.php; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$path")
            if [ "$status" != "404" ]; then
              echo "Expected 404 for $path; got $status" >&2
              exit 1
            fi
          done
      - name: Reject HTTP requests for protected project files
        run: |
          for path in /database.sql /database/verify_schema.php /includes/config.php; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8080$path")
            if [ "$status" != "403" ]; then
              echo "Expected 403 for $path; got $status" >&2
              exit 1
            fi
          done
      - name: Verify SOAR CSRF guard behavior
        run: docker compose exec -T web sh tests/check_soar_csrf.sh
      - name: Enforce incident mutation role permissions over HTTP
        run: sh tests/check_incident_rbac.sh
      - name: Verify analyst case note persistence and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_case_notes.php
          sh tests/check_case_notes_http.sh
      - name: Verify configurable detections, concurrency and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_detections.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_detections.php
          sh tests/check_detections_http.sh
      - name: Verify feed collection, schedules, rollback and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_feed_collection.php
          sh tests/check_feed_health_http.sh
      - name: Verify simulated incident lifecycle and HTTP boundaries
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_demo.php
          sh tests/check_demo_http.sh
      - name: Verify risk workspace persistence and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_risk_workspace.php
          sh tests/check_risk_workspace_http.sh
      - name: Verify playbook workspace previews, retries and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_playbook_workspace.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_playbook_previews.php
          sh tests/check_playbook_workspace_http.sh
      - name: Verify IOC discovery, saved intelligence and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_ioc_workspace.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_ioc_discovery.php
          sh tests/check_ioc_workspace_http.sh
      - name: Verify incident reports, snapshot consistency and HTTP exports
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_incident_report.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_incident_report.php
          sh tests/check_incident_report_http.sh
      - name: Verify personal inbox ownership, acknowledgements and HTTP access
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_notification_inbox.php
          sh tests/check_notification_inbox_http.sh
      - name: Verify incident queue search, filters, sorting and HTTP pagination
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_incident_queue.php
          sh tests/check_incident_queue_http.sh
      - name: Verify SOC overview provenance, workload and HTTP access
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_soc_overview.php
          sh tests/check_soc_overview_http.sh
      - name: Verify analyst event escalation, retries and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_event_escalation.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_event_escalation.php
          sh tests/check_event_escalation_http.sh
      - name: Verify assignment inbox handoff, conflicts and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_assignment_handoff.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_assignment_handoff.php
          sh tests/check_assignment_handoff_http.sh
      - name: Verify case evidence picker, atomic links and HTTP permissions
        run: |
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/integration_case_evidence.php
          docker compose exec -T -e SOAR_INTEGRATION_TEST=1 web php tests/concurrent_case_evidence.php
          sh tests/check_case_evidence_http.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop isolated services
        if: always()
        run: docker compose down --remove-orphans

  soar-regression:
    name: SOAR regression suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run database-free Phase 2, 5, 6 and 7 PHP tests
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.2-cli sh -ec '
            failed=0
            for suite in \
              tests/feed_parser_tests.php \
              tests/risk_policy_tests.php \
              tests/run_phase2_tests.php \
              tests/run_phase5_tests.php \
              tests/run_phase6_tests.php \
              tests/run_phase6_hardening_tests.php \
              tests/run_phase7_tests.php; do
              echo "Running $suite"
              if php "$suite"; then
                echo "PASS: $suite"
              else
                echo "FAIL: $suite" >&2
                failed=$((failed + 1))
              fi
            done
            echo "$failed SOAR suite(s) failed"
            [ "$failed" -eq 0 ]
          '

