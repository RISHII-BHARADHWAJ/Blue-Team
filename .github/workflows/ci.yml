name: Blue-Team PHP and Compose CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check all PHP files with PHP 8.2
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src php:8.2-cli \
            sh -c "find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l"

  compose-smoke:
    name: Docker Compose database and HTTP smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start isolated services
        run: docker compose up -d --build --wait
      - name: Verify SOAR database schema
        run: docker compose exec -T web php database/verify_schema.php
      - name: Check HTTP login route
        run: curl --fail --show-error --silent http://localhost:8080/login.php --output /dev/null
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop isolated services
        if: always()
        run: docker compose down --remove-orphans
